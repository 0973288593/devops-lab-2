name: build cafe shop

on: 
 push:
   branches:
    - main

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the box
        run: docker build -t cafe-shop .

      - name: Run the box
        run: docker run -d -p 9090:80 --name cafe cafe-shop

      - name: Test the website
        run: |
          sleep 3
          curl -f http://localhost:9090
          curl -s http://localhost:9090 | grep "DevOps"

      - name: Log in to   warehouse
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Upload the box
        run : | IMAGE=ghr.io/${GITHUB_REPOSITORY,,}
	docker tag cafe-shop $IMAGE:latest
	docker tag cafe-shop $IMAGE:${{ github.sha }}
	docker push $IMAGE.latest
	docker push $IMAGE:${{ github.sha }}